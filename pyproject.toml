[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-service-retrieval"
version = "0.1.0"
description = "Offline candidate generation for the Avito DS bootcamp task"
requires-python = ">=3.12"
dependencies = [
  "joblib==1.6.0",
  "nltk==3.10.3",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "threadpoolctl==3.7.0",
]

[project.scripts]
avito-retrieval = "avito_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
